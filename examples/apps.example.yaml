# SessionIntent - Example Apps Registry
# Copy this to ~/.config/sessionintent/apps.yaml

# CONTRIBUTORS NEEDED

# ===============
# Browser
# ===============

# Firefox
firefox:
  cmd: ["firefox", "-P", "{profile|default}"]
  append_param: "urls"
  internal_reuse: true

vivaldi:
  cmd: ["vivaldi", "--profile-directory", "{profile|default}"] # needs to be fixed
  append_param: "urls"
  internal_reuse: true

# Chrome
chrome:
  cmd: ["chrome"] # needs a profile command, i dont use chrome
  append_param: "urls"
  internal_reuse: true

# Zen Browser (flatpak) - Privacy-focused Firefox fork
zen:
  cmd: ["flatpak", "run", "app.zen_browser.zen"]
  check: "zen"
  append_param: "urls"
  internal_reuse: true

# ===============
# Tech
# ===============

# VSCode - Code editor
vscode:
  cmd: ["code", "--reuse-window", "{workspace|}"]
  primary_param: "workspace"
  internal_reuse: true

# Zed - Lightning-fast code editor
zed:
  cmd: ["zed", "{workspace|}"]
  primary_param: "workspace"
  internal_reuse: true

# wireshark - Network analyzer
wireshark:
  cmd: ["wireshark"]
  check: "wireshark"
  internal_reuse: false

# GNOME terminal - Default terminal emulator for GNOME desktop
terminal:
  cmd: ["gnome-terminal"]
  check: false
  internal_reuse: true

# Ghostty - Better alternative for Terminal
ghostty:
  cmd: ["ghostty"]
  internal_reuse: true

# ===============
# Communications
# ===============

# Discord (for users that does not use autostart)
discord:
  cmd: ["discord"]
  check: "discord"
  flags:
    background: "--start-minimized"
  internal_reuse: false

# Zoom - Video conference
zoom:
  cmd: ["zoom"]
  internal_reuse: false

# ZapZap - Unofficial WhatsApp client (flatpak)
zapzap:
  cmd: ["flatpak", "run", "com.rtosta.zapzap"]
  check: "zapzap"
  internal_reuse: false

# ===============
# Music
# ===============

# Spotify
spotify:
  cmd: ["spotify"]
  check: "spotify"
  internal_reuse: false

# ytmdesktop - YouTube Music Desktop
ytmdesktop:
  cmd: ["ytmdesktop"]
  check: "ytmdesktop"
  internal_reuse: false

# Rustune - TUI for searchable Youtube music player
rustune:
  cmd: ["rustune"]
  internal_reuse: true

# ===============
# Focus
# ===============

# gnome-pomodoro - Focus timer
gnome-pomodoro:
  cmd: ["gnome-pomodoro"]
  check: "gnome-pomodoro"
  internal_reuse: false

# ===============
# Productivity
# ===============

# obsidian - Note-taking, Knowledge base
obsidian:
  cmd: ["obsidian"]
  check: "obsidian"
  internal_reuse: false

# zotero - Citation tool
zotero:
  cmd: ["zotero"]
  check: "zotero"
  internal_reuse: false

onlyoffice:
  cmd: ["onlyoffice-desktopeditors"]
  check: "onlyoffice-desktopeditors"
  internal_reuse: false

# ===============
# Gaming
# ===============

# Steam (for users don't use autostart)
steam:
  cmd: ["steam"]
  check: "steam"
  internal_reuse: false

# lutris - Gaming launcher
lutris:
  cmd: ["lutris"]
  check: "lutris"
  internal_reuse: false

# Heroic - Epic/GOG/Amazon games launcher
# (flatpak alternative: ["flatpak", "run", "com.heroicgameslauncher.hgl"])
heroic:
  cmd: ["heroic"]
  check: "heroic"
  internal_reuse: false

# PrismLauncher - Minecraft launcher (flatpak)
prismlauncher:
  cmd: ["flatpak", "run", "org.prismlauncher.PrismLauncher"]
  check: "prismlauncher"
  internal_reuse: false

# Bottles - Wine prefix manager (flatpak)
bottles:
  cmd: ["flatpak", "run", "com.usebottles.bottles"]
  check: "bottles"
  internal_reuse: false

# ProtonPlus - Proton-GE manager for Steam/UMU (flatpak)
protonplus:
  cmd: ["flatpak", "run", "com.vysp3r.ProtonPlus"]
  check: "protonplus"
  internal_reuse: false

# DuckStation - PlayStation 1 emulator (flatpak)
duckstation:
  cmd: ["flatpak", "run", "org.duckstation.DuckStation"]
  check: "duckstation"
  internal_reuse: false

# ===============
# GNOME System
# ===============

# extension-manager - GNOME extensions manager
extension-manager:
  cmd: ["extension-manager"]
  check: "extension-manager"
  internal_reuse: false

# gnome-system-log - Log viewer
gnome-system-log:
  cmd: ["gnome-system-log"]
  check: "gnome-system-log"
  internal_reuse: false
