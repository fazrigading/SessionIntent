# SessionIntent - Example Configuration
# Copy this to ~/.config/sessionintent/config.yaml

# Config schema version (required)
version: 2

# Global defaults for all modes
defaults:
  ask_before_kill: true
  reuse_workspaces: true

# Hardware-aware mode switching
# Modes in disable_modes will not appear on battery
hardware_profiles:
  battery:
    disable_modes: [gaming, video-editing, rendering]
  plugged:
    allow_all: true

# Define your session modes
modes:
  # --- Browsing / Chilling Mode ---
  browsing:
    label: "Browsing / Chilling"
    description: "Casual web browsing, streaming music"
    
    # Firefox profile settings
    firefox:
      profile: chill
      urls:
        - https://reddit.com
        - https://youtube.com
        - https://news.ycombinator.com
    
    # Workspace assignments
    workspaces:
      1:
        - firefox
      2:
        - ytmdesktop

  # --- Work / Research Mode ---
  work:
    label: "Work / Research"
    description: "Coding, research, and productivity tools"
    
    # Firefox profile for work
    firefox:
      profile: work
      urls:
        - https://github.com
        - https://slack.com
    
    # VSCode workspace
    vscode:
      workspace: "~/Work/CurrentProject.code-workspace"
    
    workspaces:
      1:
        - firefox
        - obsidian
        - zotero
      2:
        - vscode
        - terminal
      3:
        - gnome-pomodoro
        - ytmdesktop

  # --- Gaming Mode ---
  gaming:
    label: "Gaming"
    description: "Game sessions with Discord in background"
    
    workspaces:
      1:
        - lutris
        - steam
      2:
        discord:
          server: none
          background: true

  # --- Video Editing Mode (wall power only) ---
  # Listed in hardware_profiles.battery.disable_modes above, so it
  # disappears from selection while on battery.
  video-editing:
    label: "Video Editing"
    description: "OBS + HandBrake; too hungry for battery"

    firefox:
      profile: work
      urls:
        - https://obsproject.com/wiki

    workspaces:
      1:
        - obs-studio
        - firefox
      2:
        - handbrake
        - terminal

  # --- Rendering Mode (wall power only) ---
  # Long transcodes live here; low-power stays available on battery.
  rendering:
    label: "Rendering"
    description: "Queued transcodes plus something to watch meanwhile"

    workspaces:
      1:
        - handbrake
        - terminal
      2:
        - firefox
        - ytmdesktop

  # --- Contributor Mode ---
  contributor:
    label: "Contributor Mode"
    description: "Open source contributions"
    
    firefox:
      profile: contributor
      urls:
        - https://github.com/fazrigading/yourproject
        - https://github.com/fazrigading/yourproject/issues
        - https://github.com/fazrigading/yourproject/pulls
    
    vscode:
      workspace: "~/Work/YourProject.code-workspace"
    
    discord:
      server: YourProject
    
    workspaces:
      1:
        - firefox
      2:
        - vscode
      3:
        - discord

  # --- Tinkering Mode ---
  tinkering:
    label: "Linux Tweaking"
    description: "System administration and learning"
    
    workspaces:
      1:
        firefox:
          urls:
            - https://archlinux.org
            - https://www.youtube.com
      2:
        - extension-manager
        - terminal

  # --- Low Power Mode ---
  # Tip: disable heavy modes on battery via top-level hardware_profiles.
  low-power:
    label: "Battery Saver"
    description: "Lightweight setup for battery power"

    firefox:
      profile: minimal
      urls: []
    
    workspaces:
      1:
        - firefox
        - obsidian
        - terminal

  # --- Presentation Mode ---
  presentation:
    label: "Presentation"
    description: "Focused, distraction-free"
    
    firefox:
      profile: presentation
      urls:
        - https://example.com/presentation

    workspaces:
      1:
        - firefox

  # --- Debug Mode ---
  debug:
    label: "Debug"
    description: "Troubleshooting and monitoring"
    
    workspaces:
      1:
        - terminal
        - firefox:
            urls: ["https://localhost:8080"]
      2:
        - gnome-system-log
        - wireshark

  # --- Deep Work Mode ---
  deep-work:
    label: "Deep Work"
    description: "Zed + docs + terminal, timer and music in the back"

    firefox:
      profile: work
      urls:
        - https://docs.python.org

    zed:
      workspace: "~/Work/CurrentProject"

    workspaces:
      1:
        - zed
        - firefox
      2:
        - ghostty
        - terminal
      3:
        - gnome-pomodoro
        - ytmdesktop

  # --- Minecraft Mode ---
  minecraft:
    label: "Minecraft"
    description: "PrismLauncher up front, wiki and Discord alongside"

    firefox:
      profile: chill
      urls:
        - https://minecraft.wiki

    workspaces:
      1:
        - prismlauncher
        - firefox
      2:
        discord:
          server: Minecraft
          background: true

  # --- Retro Mode ---
  retro:
    label: "Retro Gaming"
    description: "PS1 via DuckStation, Bottles for the Windows leftovers"

    firefox:
      profile: chill
      urls:
        - https://www.retroachievements.org

    workspaces:
      1:
        - duckstation
        - bottles
      2:
        - discord
        - ytmdesktop