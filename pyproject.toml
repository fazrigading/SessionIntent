[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionintent"
dynamic = ["version"]
description = "A declarative session orchestration system for GNOME Wayland"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
sessionintent = "sessionintent.__main__:main"

[project.urls]
Homepage = "https://github.com/fazrigading/SessionIntent"
Documentation = "https://github.com/fazrigading/SessionIntent/docs"
Source = "https://github.com/fazrigading/SessionIntent"
Issues = "https://github.com/fazrigading/SessionIntent/issues"

[tool.setuptools.dynamic]
version = { attr = "sessionintent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sessionintent = ["app/app_categories.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=sessionintent --cov-report=term-missing"

[tool.coverage.run]
source = ["sessionintent"]
omit = ["*/__init__.py", "*/__main__.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
